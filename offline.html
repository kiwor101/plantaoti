<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769df">
<title>Sem conexão · Plantão TI</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fc;color:#10213c;text-align:center}
.card{max-width:340px;background:#fff;border:1px solid #d8e2f0;border-radius:12px;padding:28px 22px}
img{width:64px;height:64px;border-radius:14px}
h1{font-size:20px;margin:16px 0 6px}
p{color:#506481;margin:0 0 20px}
button{font:inherit;font-weight:600;width:100%;min-height:46px;border:0;border-radius:8px;background:#1769df;color:#fff;cursor:pointer}
</style>
</head>
<body>
<main class="card">
  <img src="icons/icon-192.png" alt="">
  <h1>Sem conexão</h1>
  <p>O Plantão TI precisa de internet para registrar e conferir relatórios. Confira o Wi-Fi ou os dados móveis.</p>
  <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
