# Gera o APK Android do Plantão TI (pasta android-app/).
# - Rodar à mão: Actions > "APK Android" > Run workflow. O APK fica em "Artifacts".
# - Publicar versão: criar uma tag android-vX.Y (ex.: android-v1.0). O APK vira anexo de uma Release,
#   com link direto para baixar no celular.
# Segredos necessários (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências e sincronizar o projeto Android
        run: |
          npm ci
          npm run sync

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64 (veja android-app/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plantao-ti.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/plantao-ti.jks" >> "$GITHUB_ENV"

      - name: Definir versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then NOME="${GITHUB_REF#refs/tags/android-v}"; else NOME="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$NOME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Gerar APK assinado
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/saida/PlantaoTI-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PlantaoTI-${{ env.VERSION_NAME }}
          path: saida/*.apk
          if-no-files-found: error

      - name: Publicar na Release (só para tags android-v*)
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" saida/*.apk \
            --title "Plantão TI Android $VERSION_NAME" \
            --notes "Baixe o arquivo .apk no celular Android e toque nele para instalar."
